# ==========================================
# 1. NOTIFICATION SERVICE (Порт 8004)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: logistics_notification_service:latest
          imagePullPolicy: Never # Говорим K8s брать локальный собранный образ
          command: ["uvicorn"]
          args: ["services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8004"]
          ports:
            - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 8004
      targetPort: 8004

---
# ==========================================
# 2. AUTH SERVICE (Порт 8002, 2 реплики)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: logistics_auth_service:latest
          imagePullPolicy: Never
          command: ["uvicorn"]
          args: ["services.auth_service.main:app", "--host", "0.0.0.0", "--port", "8002"]
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: logistics-secret
                  key: DATABASE_URL
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: logistics-config
                  key: NOTIFICATION_SERVICE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002

---
