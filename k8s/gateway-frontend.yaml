# ==========================================
# 1. CONFIGMAP ДЛЯ НАСТРОЕК NGINX
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;
            server_name localhost;

            # Маршрутизация API Gateway на K8s-сервисы
            location /api/login { proxy_pass http://auth-service:8002/login; }
            location /api/register { proxy_pass http://auth-service:8002/register; }
            location /api/auth/ { proxy_pass http://auth-service:8002/auth/; }
            location /api/verify-email { proxy_pass http://auth-service:8002/verify-email; }
            location /api/resend-code { proxy_pass http://auth-service:8002/resend-code; }

            location /api/orders { proxy_pass http://order-service:8005/orders; }
            location /api/ml/predict { proxy_pass http://order-service:8005/ml/predict; }

            location /api/analytics { proxy_pass http://analytics-service:8006/analytics; }

            location /api/users/me { proxy_pass http://user-service:8003/users/me; }
            location /api/users/ { proxy_pass http://analytics-service:8006/users/; }

            # Все остальные запросы отправляем на фронтенд
            location / { proxy_pass http://frontend:3000; }
        }
    }

---
# ==========================================
# 2. API GATEWAY DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config-volume
          configMap:
            name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: LoadBalancer # Выпускает 80 порт наружу на твой компьютер
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ==========================================
# 3. FRONTEND DEPLOYMENT & SERVICE
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: logistics_frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000