groups:
  - name: logistics_alerts
    rules:
      - alert: HighLatencyWarning
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="logistics_app"}[1m])) by (le)) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API Latency is too high"
          description: "95th percentile latency is above 500ms for more than 1 minute."

      - alert: BackendDownCritical
        expr: up{job="logistics_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend API is DOWN"
          description: "The logistics_app container is not responding. SRE team wake up!"

      - alert: HighCPUUsageCritical
        expr: (100 - (avg(rate(node_cpu_seconds_total{job="node_exporter", mode="idle"}[2m])) * 100)) > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Host CPU usage is too high"
          description: "Average host CPU usage is above 85% for more than 2 minutes."

      - alert: OrderServiceHighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="order_service", status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{job="order_service"}[2m]))
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Order service error rate is high"
          description: "5xx error rate for order-service is above 5% for more than 2 minutes."